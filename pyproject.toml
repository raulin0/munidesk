[project]
name = "munidesk"
version = "0.1.0"
description = "Client municipalities data management made easy"
requires-python = ">=3.15"
dependencies = [
    "django>=6.1.3",
    "django-environ>=0.14.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]